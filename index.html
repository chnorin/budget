<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Google Sheets Web App</title>
</head>
<body>
  <h1>Skicka till Google Sheets</h1>
  <input type="text" id="inputBox" placeholder="Skriv något..." />
  <button onclick="sendData()">Skicka</button>

  <h2>Respons från Sheets:</h2>
  <div id="responseArea">Ingen data än</div>

  <script>
    async function sendData() {
      const inputValue = document.getElementById("inputBox").value;
      const responseArea = document.getElementById("responseArea");

      try {
        const res = await fetch("https://script.google.com/macros/s/AKfycbxxueuC0G_eYv0aQdLAdOszTZ5gXkIjQ674GRLKqUeuscbA5VhonroAcQcpGBoGapPqdw/exec", {
          method: "POST",
          body: JSON.stringify({ input: inputValue }),
          headers: {
            "Content-Type": "application/json"
          }
        });

        const data = await res.json();
        responseArea.textContent = data.response;
      } catch (error) {
        responseArea.textContent = "Fel vid kontakt med Sheets: " + error;
      }
    }
  </script>
</body>
</html>
